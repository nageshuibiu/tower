name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned .app (Release, iphoneos)
        run: |
          xcodebuild \
            -project Tower.xcodeproj \
            -scheme Tower \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP_PATH=$(find build/DD/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "Packaging: $APP_PATH"
          rm -rf Payload Tower-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Tower-unsigned.ipa Payload
          ls -lh Tower-unsigned.ipa

      - name: Upload IPA as artifact (private, only visible to repo collaborators)
        uses: actions/upload-artifact@v4
        with:
          name: Tower-unsigned-ipa
          path: Tower-unsigned.ipa
          retention-days: 90
